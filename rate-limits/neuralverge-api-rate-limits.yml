scope_model: per-organization
scope_note: >-
  Limits apply per organization, shared across every API key and user in the
  org (not tracked per key). Higher org-wide limits can be configured on request.
enforcement: queue
enforcement_note: >-
  Instead of rejecting on the instant a limit is hit, requests are queued (oldest
  first, per endpoint) and started as capacity frees. A request only fails with
  429 if still waiting after 60 seconds in the queue; a 429 therefore means the
  request never ran and is always safe to retry.
exhaustion_status: 429
response_headers: []
response_headers_note: No rate-limit response headers (X-RateLimit-*, RateLimit-*, Retry-After) are documented.
