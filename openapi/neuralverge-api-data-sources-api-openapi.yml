openapi: 3.2.0
info:
  title: NeuralVerge Data Sources API
  version: 1.0.0
  description: NeuralVerge API for AI research workflows, search, extraction, and structured data source execution.
servers:
- url: https://api.neuralverge.ai
  description: NeuralVerge API
security:
- BearerAuth: []
tags:
- name: Data Sources
  description: Focused provider lookups for LinkedIn, email, phone, company, and Amazon data.
paths:
  /functions/v1/run-linkedin-email:
    post:
      tags:
      - Data Sources
      summary: Run LinkedIn Email
      description: Looks up a LinkedIn profile and returns contact details, including email when available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              properties:
                username:
                  type: string
                  description: Full LinkedIn profile URL.
            example:
              username: https://www.linkedin.com/in/john-doe/
      responses:
        '200':
          description: Lookup completed.
          content:
            application/json:
              example:
                session_id: 11111111-1111-1111-1111-111111111111
                kind: linkedin_email
                username: https://www.linkedin.com/in/sam-altman/
                includeEmail: true
                human: '# LinkedIn people profile + Email


                  - **Profile_url:** https://www.linkedin.com/in/sam-altman/

                  - **Fullname:** Sam Altman

                  - **Headline:** CEO at OpenAI

                  - **Location:** San Francisco Bay Area

                  - **About:** CEO of OpenAI and former president of Y Combinator.

                  - **Email:** sam@openai.com'
                machine:
                  total_items: 1
                  first_item:
                    basic_info:
                      fullname: Sam Altman
                      headline: CEO at OpenAI
                      profile_url: https://www.linkedin.com/in/sam-altman/
                      location:
                        full: San Francisco Bay Area
                      about: CEO of OpenAI and former president of Y Combinator.
                    email: sam@openai.com
                  items:
                  - basic_info:
                      fullname: Sam Altman
                      headline: CEO at OpenAI
                      profile_url: https://www.linkedin.com/in/sam-altman/
                    email: sam@openai.com
                total_points: 10
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '402':
          description: Payment Required
        '500':
          description: Internal Error
      operationId: postFunctionsV1RunLinkedinEmail
      x-operation-id-source: derived
  /functions/v1/run-linkedin-domain:
    post:
      tags:
      - Data Sources
      summary: Run LinkedIn Domain
      description: Finds a LinkedIn profile by company name or domain and full name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - company_or_domain
              - full_name
              properties:
                company_or_domain:
                  type: string
                full_name:
                  type: string
            example:
              company_or_domain: openai.com
              full_name: John Doe
      responses:
        '200':
          description: Lookup completed.
          content:
            application/json:
              example:
                session_id: 22222222-2222-2222-2222-222222222222
                kind: linkedin_domain
                company_or_domain: openai.com
                full_name: Sam Altman
                human: '# LinkedIn profile by name and domain


                  - **Company name / Domain:** openai.com

                  - **Full name:** Sam Altman

                  - **Matched name:** Sam Altman

                  - **Profile URL:** https://www.linkedin.com/in/sam-altman/

                  - **Headline:** CEO at OpenAI

                  - **Company:** OpenAI

                  - **Location:** San Francisco Bay Area

                  - **Records returned:** 1


                  ## Summary


                  CEO at OpenAI and former president of Y Combinator.'
                machine:
                  total_items: 1
                  first_item:
                    fullName: Sam Altman
                    profileUrl: https://www.linkedin.com/in/sam-altman/
                    headline: CEO at OpenAI
                    companyName: OpenAI
                    location: San Francisco Bay Area
                    summary: CEO at OpenAI and former president of Y Combinator.
                total_points: 10
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '402':
          description: Payment Required
        '500':
          description: Internal Error
      operationId: postFunctionsV1RunLinkedinDomain
      x-operation-id-source: derived
  /functions/v1/run-linkedin-company-search:
    post:
      tags:
      - Data Sources
      summary: Run LinkedIn Company Search
      description: Searches LinkedIn companies by query and optional filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - searchQuery
              properties:
                searchQuery:
                  type: string
                companySize:
                  type: array
                  items:
                    type: string
                industryIds:
                  type: array
                  items:
                    type: string
                locations:
                  type: array
                  items:
                    type: string
                maxItems:
                  type: number
                scraperMode:
                  type: string
                startPage:
                  type: number
            example:
              searchQuery: AI companies
              companySize:
              - 51-200
              industryIds:
              - Software
              locations:
              - Amsterdam
              maxItems: 5
              scraperMode: short
              startPage: 1
      responses:
        '200':
          description: Search completed.
          content:
            application/json:
              example:
                session_id: 33333333-3333-3333-3333-333333333333
                kind: linkedin_company_search
                companySize:
                - 51-200
                industryIds:
                - Software Development
                locations:
                - San Francisco Bay Area
                maxItems: 2
                scraperMode: short
                searchQuery: AI safety companies
                startPage: 1
                human: '# LinkedIn company search


                  - **Results returned:** 2


                  ### OpenAI


                  - **Profile URL:** https://www.linkedin.com/company/openai/

                  - **Industry:** Research Services

                  - **Location:** San Francisco Bay Area

                  - **Followers:** 3200000

                  - **Summary:** AI research and deployment company.


                  ### Anthropic


                  - **Profile URL:** https://www.linkedin.com/company/anthropicresearch/

                  - **Industry:** Software Development

                  - **Location:** San Francisco, California

                  - **Followers:** 450000

                  - **Summary:** Building reliable, interpretable, and steerable AI systems.'
                machine:
                  total_items: 2
                  first_item:
                    name: OpenAI
                    url: https://www.linkedin.com/company/openai/
                    industry: Research Services
                    headquarters: San Francisco Bay Area
                    followers: '3200000'
                    description: AI research and deployment company.
                  items:
                  - name: OpenAI
                    url: https://www.linkedin.com/company/openai/
                    industry: Research Services
                  - name: Anthropic
                    url: https://www.linkedin.com/company/anthropicresearch/
                    industry: Software Development
                points_per_company: 5
                total_points: 10
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '402':
          description: Payment Required
        '500':
          description: Internal Error
      operationId: postFunctionsV1RunLinkedinCompanySearch
      x-operation-id-source: derived
