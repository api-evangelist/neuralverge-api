openapi: 3.2.0
info:
  title: NeuralVerge AI Extract API
  version: 1.0.0
  description: NeuralVerge API for AI research workflows, search, extraction, and structured data source execution.
servers:
- url: https://api.neuralverge.ai
  description: NeuralVerge API
security:
- BearerAuth: []
tags:
- name: AI Extract
  description: Schema-driven extraction workflows.
paths:
  /functions/v1/run-extract:
    post:
      tags:
      - AI Extract
      summary: Run Extract
      description: Loads a page by URL and extracts structured data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - instructions
              - settings
              properties:
                url:
                  type: string
                instructions:
                  type: string
                settings:
                  type: object
                  properties:
                    country_code:
                      type: string
                    extract_schema_json:
                      type: string
            example:
              url: https://example.com
              instructions: Collect company name and contact details.
              settings:
                country_code: us
                extract_schema_json: '{ "type": "object" }'
      responses:
        '200':
          description: Extraction completed.
          content:
            application/json:
              example:
                session_id: 11111111-1111-1111-1111-111111111111
                kind: extract
                url: https://example.com
                machine:
                  company_name: Example Inc.
                  contact_email: hello@example.com
                total_points: 3
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '402':
          description: Payment Required
        '500':
          description: Internal Error
      operationId: postFunctionsV1RunExtract
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
