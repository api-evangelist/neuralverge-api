openapi: 3.2.0
info:
  title: NeuralVerge Search API
  version: 1.0.0
  description: NeuralVerge API for AI research workflows, search, extraction, and structured data source execution.
servers:
- url: https://api.neuralverge.ai
  description: NeuralVerge API
security:
- BearerAuth: []
tags:
- name: Search
  description: Fast, synchronous web search with no session or polling.
paths:
  /functions/v1/run-search:
    post:
      tags:
      - Search
      summary: Run Search
      description: Runs a web search and returns a structured search payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              - settings
              properties:
                query:
                  type: string
                settings:
                  type: object
                  properties:
                    country:
                      type: string
                    language:
                      type: string
                    max_results:
                      type: number
            example:
              query: OpenAI pricing
              settings:
                country: us
                language: en
                max_results: 10
      responses:
        '200':
          description: Search completed.
          content:
            application/json:
              example:
                session_id: 11111111-1111-1111-1111-111111111111
                kind: search
                query: OpenAI pricing
                results:
                - rank: 1
                  title: OpenAI Pricing
                  url: https://openai.com/pricing
                  snippet: Simple and flexible pricing.
                total_points: 5
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '402':
          description: Payment Required
        '500':
          description: Internal Error
      operationId: postFunctionsV1RunSearch
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
