name: NeuralVerge API
description: >-
  AI research, web extraction, search, and data enrichment platform exposing a REST API, a public OpenAPI contract, an
  llms.txt docs index, and a hosted remote MCP server. Capabilities include multi-step AI Research, schema-driven AI
  Extract, reusable AI Agents workflows, synchronous Search, and 29 data sources spanning company intelligence,
  corporate registries, contact enrichment, email/phone lookup, and LinkedIn data.
