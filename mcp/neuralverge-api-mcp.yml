server:
  name: neuralverge
  transport: http
  description: NeuralVerge exposes its full REST API as a remote Model Context Protocol server over the
    Streamable HTTP transport. The server is stateless (each request handled independently) and every
    tool is a thin 1:1 wrapper around the corresponding REST endpoint. Bearer token (same as REST) required;
    Accept must include text/event-stream.
  url: https://api.neuralverge.ai/functions/v1/mcp-server
  transport_detail: streamable-http
  stateless: true
  auth:
    scheme: bearer
    header: 'Authorization: Bearer <API_KEY>'
    note: 401 Unauthorized before any tool runs on missing/invalid token. Once authenticated, per-tool
      errors (invalid params, 402 usage limits, upstream failures) return inside the MCP tool result with
      isError:true rather than as an HTTP failure.
probe:
  method: tools/list
  http_status: 200
  fetched: '2026-09-18'
  tool_count: 15
  raw: neuralverge-api-mcp-tools-list.json
tools:
- name: run_search
  description: Runs a synchronous web search and returns a structured list of ranked results (title, url,
    snippet) immediately, without polling.
  source_operation: openapi/neuralverge-api-openapi.json#POST /functions/v1/run-search
- name: run_extract
  description: Loads a webpage by URL and extracts structured data from it according to natural-language
    instructions and/or a JSON schema. Synchronous — returns the result immediately.
  source_operation: openapi/neuralverge-api-openapi.json#POST /functions/v1/run-extract
